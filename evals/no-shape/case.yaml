schema_version: "1.1"
name: no-shape
description: A working bot whose commands are built four different ways, with overlapping intake files and a file named after a ticket.
tags: [planted]
runs: 1
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Agent, Read, Glob, Grep, Bash]
  prompt: |
    Use the coherence:readability-reviewer subagent to review this whole repository.
    Then repeat its report word for word as your final message.
context:
  scaffold_script: scaffold.sh
